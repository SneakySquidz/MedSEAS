name: Update SST grid

# Monthly only. Appends any new months to data/sst.png and opens a pull request
# if there are any; otherwise it exits having done almost nothing.
#
# One-off setup: repository secrets COPERNICUSMARINE_SERVICE_USERNAME and
# COPERNICUSMARINE_SERVICE_PASSWORD (free account at marine.copernicus.eu), and under
# Settings > Actions > General allow "Read and write permissions" and
# "Allow GitHub Actions to create and approve pull requests".
on:
  schedule:
    - cron: "17 5 7 * *"   # 07:17 UTC on the 7th of each month

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-sst
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-sst.txt
      - name: Install
        run: pip install -r scripts/requirements-sst.txt
      - name: Build SST grid
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: python scripts/build_sst.py
      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/update-sst
          title: "Update SST grid"
          commit-message: "Update SST grid from Copernicus Marine"
          body: "Rebuilt by the Update SST grid workflow. Check the slider's last month on the preview before merging."
          add-paths: |
            data/sst.png
            data/sst.json
            data/sst_clim.png
